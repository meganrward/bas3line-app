name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test -- --watchAll=false

      - name: Build
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          REACT_APP_MONITOR_SUPABASE_URL: ${{ secrets.REACT_APP_MONITOR_SUPABASE_URL }}
          REACT_APP_MONITOR_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_MONITOR_SUPABASE_ANON_KEY }}
        run: npm run build

      # GitHub Pages has no SPA fallback: serve the app for deep links and refreshes
      - name: Add SPA fallback
        run: cp build/index.html build/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
